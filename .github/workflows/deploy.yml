name: Deploy Eleventy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Start deployment timer
        run: date +%s > /tmp/blogmoi-deploy-start
      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Extract dictionary candidates from all published articles
        run: npm run dictionary:extract
      - name: Build Eleventy site
        run: |
          build_start=$(date +%s%N)
          npm run build
          build_end=$(date +%s%N)
          build_ms=$(( (build_end - build_start) / 1000000 ))
          echo "Eleventy build: $build_ms ms" >> "$GITHUB_STEP_SUMMARY"
      - name: Save dictionary review queue
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-review-queue
          path: data/dictionary/pending.json
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report total duration
        if: always()
        run: |
          if [ -f /tmp/blogmoi-deploy-start ]; then
            total_start=$(cat /tmp/blogmoi-deploy-start)
            total_seconds=$(( $(date +%s) - total_start ))
            echo "Workflow total after checkout: $total_seconds seconds" >> "$GITHUB_STEP_SUMMARY"
          fi
