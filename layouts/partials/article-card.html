<article class="article-card">
  <a class="article-card__link" href="{{ .RelPermalink }}">
    <div class="article-card__media">{{ with .Params.cover_url }}<img src="{{ . | safeURL }}" alt="{{ $.Params.cover_alt | default $.Title }}" loading="lazy">{{ else }}<span class="card-placeholder" aria-hidden="true">bm</span>{{ end }}</div>
    <div class="article-card__body">
      <p class="eyebrow">{{ with .Params.categories }}{{ index . 0 }}{{ else }}Bài viết{{ end }}</p>
      <h3>{{ .Title }}</h3>
      <p>{{ .Description | default .Summary | plainify | truncate 150 }}</p>
      <div class="card-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "2 Jan 2006" }}</time><span>{{ .ReadingTime }} phút đọc</span></div>
    </div>
  </a>
</article>
