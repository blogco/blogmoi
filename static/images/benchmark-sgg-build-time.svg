rect x="524" y="158.1" width="40" height="177.9" rx="5" fill="#6877c5"/><text x="544" y="149.1" text-anchor="middle" class="value">1.094s</text><text x="544" y="360" text-anchor="middle" class="framework">Astro</text></g><g><text x="780" y="48" text-anchor="middle" class="panel-title">1,000 bài viết</text><line x1="658" y1="336.0" x2="902" y2="336.0" class="grid"/><text x="650" y="340.0" text-anchor="end" class="tick">0.0</text><line x1="658" y1="214.0" x2="902" y2="214.0" class="grid"/><text x="650" y="218.0" text-anchor="end" class="tick">1.0</text><line x1="658" y1="92.0" x2="902" y2="92.0" class="grid"/><text x="650" y="96.0" text-anchor="end" class="tick">2.0</text><rect x="678" y="304.8" width="40" height="31.2" rx="5" fill="#ef8354"/><text x="698" y="295.8" text-anchor="middle" class="value">0.256s</text><text x="698" y="360" text-anchor="middle" class="framework">Hugo</text><rect x="744" y="233.9" width="40" height="102.1" rx="5" fill="#4b9b83"/><text x="764" y="224.9" text-anchor="middle" class="value">0.837s</text><text x="764" y="360" text-anchor="middle" class="framework">Eleventy</text><rect x="810" y="94.6" width="40" height="241.4" rx="5" fill="#6877c5"/><text x="830" y="85.6" text-anchor="middle" class="value">1.979s</text><text x="830" y="360" text-anchor="middle" class="framework">Astro</text></g>
