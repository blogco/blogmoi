name: Deploy Eleventy site to GitHub Pages

on:
  push:
    branches: [main]
    # The sync job commits its durable queue and public index before building.
    # Those data-only commits must not start another Pages deployment.
    paths-ignore:
      - data/dictionary/pending.json
      - data/expenses/transactions.json
  schedule:
    # 00:00 UTC = 07:00 Asia/Bangkok (GMT+7); GitHub may delay runs.
    - cron: "0 0 * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      publish_daily_news:
        description: Publish a random English-Korean brief now if today has no post
        type: boolean
        default: false
      refresh_yy_info:
        description: Refresh YY info public data
        type: boolean
        default: false
      news_source_url:
        description: Optional Korea Times article URL for an English-Korean brief
        type: string
        required: false
        default: ""
      dictionary_payload:
        description: Verified manual translations submitted from the dictionary page
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check daily news publication and retry window
        id: news_due
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.publish_daily_news || inputs.news_source_url != ''))
        env:
          NEWS_MANUAL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/check-scheduled-news.mjs

      - name: Set up Python for local news models
        if: steps.news_due.outputs.due == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore local news model cache
        id: news_model_cache
        if: steps.news_due.outputs.due == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: news-cpu-models-v1-${{ runner.os }}-${{ hashFiles('scripts/news/requirements.txt', 'scripts/news/local_brief.py') }}

      - name: Install CPU news model dependencies
        if: steps.news_due.outputs.due == 'true'
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/news/requirements.txt

      - name: Generate one English-Korean news brief locally
        id: generate_news
        if: steps.news_due.outputs.due == 'true'
        env:
          NEWS_SOURCE_URL: ${{ inputs.news_source_url || '' }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: node --use-env-proxy scripts/publish-scheduled-news.mjs

      - name: Save downloaded local news models even after a generation failure
        if: always() && steps.news_due.outputs.due == 'true' && steps.news_model_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.news_model_cache.outputs.cache-primary-key }}

      - name: Report scheduled news outcome
        if: always() && steps.news_due.outputs.due == 'true'
        env:
          NEWS_OUTCOME: ${{ steps.generate_news.outcome }}
        run: |
          echo "English-Korean news generation: $NEWS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: Korea Times South Korea homepage. Daily target 07:00 GMT+7; retries until 10:00. Publication requires the subsequent build and deploy to succeed." >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh YY info public feeds
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_yy_info)
        run: node --use-env-proxy scripts/refresh-yy-info.mjs

      - name: Import translations confirmed in the dictionary page
        id: import
        if: github.event_name == 'workflow_dispatch' && inputs.dictionary_payload != ''
        run: npm run dictionary:import

      - name: Extract vocabulary from published articles
        if: github.event.schedule != '*/30 * * * *'
        id: extract
        run: npm run dictionary:sync

      - name: Save private review queue artifact
        if: always() && github.event.schedule != '*/30 * * * *'
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-review-queue
          path: data/dictionary/pending.json
          if-no-files-found: warn
          retention-days: 90

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Eleventy site
        run: |
          npm run build
          node -e "const fs=require('node:fs'); for (const p of ['_site/sitemap.xml','_site/index.xml','_site/search-index.json','_site/dictionary-index.json','_site/dictionary-candidates.json']) if (!fs.existsSync(p)) throw new Error('Missing build output: '+p); const source=JSON.parse(fs.readFileSync('src/_data/dictionary-data.json','utf8')); const index=JSON.parse(fs.readFileSync('_site/dictionary-index.json','utf8')); if (source.entries.filter(e=>['published','reviewed'].includes(e.status)).length !== index.length) throw new Error('Dictionary index count does not match published source data'); const candidates=JSON.parse(fs.readFileSync('_site/dictionary-candidates.json','utf8')); if (!Array.isArray(candidates)) throw new Error('Dictionary candidate feed must be an array'); console.log('Dictionary JSON and required static outputs verified.');"

      - name: Persist validated content before deployment
        id: persist_dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/dictionary/pending.json src/_data/dictionary-data.json data/editorial-topic-suggestions.json static/data/yy-info.json
          find src/posts -maxdepth 1 -name 'koreatimes-*.md' -type f -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "Content is already current."
            exit 0
          fi
          git commit -m "chore(content): publish validated news and sync vocabulary"
          git pull --rebase origin main
          git push origin "HEAD:main"
          # Rebuild from the exact merged tree, including concurrent data changes.
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report dictionary and deployment results
        if: always() && github.event.schedule != '*/30 * * * *'
        env:
          EXTRACT_OUTCOME: ${{ steps.extract.outcome || 'skipped' }}
          IMPORT_OUTCOME: ${{ steps.import.outcome || 'skipped' }}
          PERSIST_OUTCOME: ${{ steps.persist_dictionary.outcome || 'skipped' }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome || 'skipped' }}
        run: node scripts/dictionary-report.mjs
