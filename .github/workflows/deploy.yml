name: Deploy Eleventy site to GitHub Pages

on:
  push:
    branches: [main]
    # The sync job commits its durable queue and public index before building.
    # Those data-only commits must not start another Pages deployment.
    paths-ignore:
      - data/dictionary/pending.json
      - src/_data/dictionary-data.json
      - data/expenses/transactions.json
  workflow_dispatch:
    inputs:
      dictionary_payload:
        description: Verified manual translations submitted from the dictionary page
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Import translations confirmed in the dictionary page
        id: import
        if: github.event_name == 'workflow_dispatch' && inputs.dictionary_payload != ''
        run: npm run dictionary:import

      - name: Extract vocabulary from published articles
        id: extract
        run: npm run dictionary:sync

      - name: Persist dictionary files before build
        id: persist_dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/dictionary/pending.json src/_data/dictionary-data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dictionary files are already current."
            exit 0
          fi
          git commit -m "chore(dictionary): sync article vocabulary"
          git pull --rebase origin main
          git push origin "HEAD:main"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Save private review queue artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-review-queue
          path: data/dictionary/pending.json
          if-no-files-found: warn
          retention-days: 90

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Eleventy site
        run: |
          npm run build
          node -e "const fs=require('node:fs'); for (const p of ['_site/sitemap.xml','_site/index.xml','_site/search-index.json','_site/dictionary-index.json','_site/dictionary-candidates.json']) if (!fs.existsSync(p)) throw new Error('Missing build output: '+p); const source=JSON.parse(fs.readFileSync('src/_data/dictionary-data.json','utf8')); const index=JSON.parse(fs.readFileSync('_site/dictionary-index.json','utf8')); if (source.entries.filter(e=>['published','reviewed'].includes(e.status)).length !== index.length) throw new Error('Dictionary index count does not match published source data'); const candidates=JSON.parse(fs.readFileSync('_site/dictionary-candidates.json','utf8')); if (!Array.isArray(candidates)) throw new Error('Dictionary candidate feed must be an array'); console.log('Dictionary JSON and required static outputs verified.');"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report dictionary and deployment results
        if: always()
        env:
          EXTRACT_OUTCOME: ${{ steps.extract.outcome || 'skipped' }}
          IMPORT_OUTCOME: ${{ steps.import.outcome || 'skipped' }}
          PERSIST_OUTCOME: ${{ steps.persist_dictionary.outcome || 'skipped' }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome || 'skipped' }}
        run: node scripts/dictionary-report.mjs
